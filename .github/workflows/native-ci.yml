name: 原生版 CI（android-native）

on:
  push:
    branches: [android, main]
    paths: ['android-native/**', '.github/workflows/native-ci.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: castle-native-debug
          path: android-native/app/build/outputs/apk/debug/*.apk
