name: 原生版 CI（android-native）

on:
  push:
    branches: [android, main]
    paths: ['android-native/**', '.github/workflows/native-ci.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: castle-native-debug
          path: android-native/app/build/outputs/apk/debug/*.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: castle-native-debug

      - name: 开启 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 模拟器安装启动截图
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r *.apk
            adb shell monkey -p io.github.tsuiwiki.castlediary -c android.intent.category.LAUNCHER 1
            sleep 20
            adb exec-out screencap -p > diary.png
            adb shell input tap 540 2200
            sleep 3
            adb exec-out screencap -p > diary2.png
            adb logcat -d -s AndroidRuntime:E '*:S' > logcat.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke
          path: |
            diary.png
            diary2.png
            logcat.txt
